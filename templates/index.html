<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JokerxColor - 颜色管理</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300A9E0'/><circle cx='70' cy='70' r='30' fill='%23FF003E'/></svg>">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="logo-dot"></div>
      <span>JokerxColor</span>
    </a>
    <div class="navbar-actions">
      <button class="btn btn-ghost btn-icon" id="themeToggle" title="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <a href="/settings" class="btn btn-ghost btn-icon" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
      <button class="btn btn-ghost btn-icon" id="logoutBtn" title="退出登录" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- 主布局：左侧边栏 + 主内容 -->
  <div class="app-layout">
    <!-- 左侧分组边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>分组</span>
      </div>
      <div class="sidebar-groups" id="sidebarGroups"></div>
      <div class="sidebar-add-group" id="addGroupBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>新建分组</span>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-header">
        <h1 class="content-title" id="currentGroupName">默认分组</h1>
        <div class="content-actions">
          <button class="btn btn-primary btn-sm" id="addColorBtn">+ 添加颜色</button>
          <button class="btn btn-danger-outline btn-sm" id="deleteGroupBtn" title="删除当前分组">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            删除分组
          </button>
        </div>
      </div>
      <div class="colors-grid" id="colorsGrid"></div>
    </main>
  </div>

  <!-- 添加颜色模态框 -->
  <div class="modal-overlay" id="addColorModal">
    <div class="modal">
      <div class="modal-title">添加颜色</div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">颜色名称（可选）</label>
          <input type="text" class="form-input" id="newColorName" placeholder="例如：天空蓝">
        </div>
        <div class="form-group">
          <label class="form-label">颜色值</label>
          <div class="color-picker-wrapper">
            <input type="color" id="newColorPicker" value="#00A9E0">
            <input type="text" class="form-input" id="newColorHex" value="#00A9E0" placeholder="#00A9E0" style="text-transform:uppercase;font-family:monospace;">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('addColorModal')">取消</button>
        <button class="btn btn-primary" id="confirmAddColor">添加</button>
      </div>
    </div>
  </div>

  <!-- 确认删除模态框 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-title" id="confirmTitle">确认操作</div>
      <div class="modal-body">
        <p id="confirmMessage" style="color:var(--text-secondary);">确定要执行此操作吗？</p>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('confirmModal')">取消</button>
        <button class="btn btn-danger" id="confirmOkBtn">确认删除</button>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
