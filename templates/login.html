<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - JokerxColor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='13' height='13' rx='3' fill='%2300A9E0'/><rect x='16' y='16' width='13' height='13' rx='3' fill='%23FF003E'/></svg>">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <svg class="login-logo-icon" width="56" height="56" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="13" height="13" rx="3" fill="#00A9E0"/><rect x="16" y="16" width="13" height="13" rx="3" fill="#FF003E"/></svg>
      <h1 class="login-title">JokerxColor</h1>
      <p class="login-subtitle">颜色管理平台</p>

      <div class="login-error" id="loginError" {% if error %}style="display:block;"{% endif %}>{% if error %}{{ error }}{% endif %}</div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="username" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group" id="totpGroup" style="display:none;">
          <label class="form-label">双因素认证码</label>
          <input type="text" class="form-input" id="totpCode" placeholder="请输入 6 位验证码" maxlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px;">登录</button>
      </form>

      {% if casdoor_enabled %}
      <div class="login-divider">或</div>
      <a href="/auth/casdoor" class="btn btn-casdoor">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        使用 Casdoor SSO 登录
      </a>
      {% endif %}
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const totpGroup = document.getElementById('totpGroup');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const totpCode = document.getElementById('totpCode').value.trim();

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, totp_code: totpCode})
        });
        const data = await resp.json();
        if (resp.ok) {
          window.location.href = '/';
        } else {
          if (data.need_totp) {
            totpGroup.style.display = 'block';
            document.getElementById('totpCode').focus();
          }
          showError(data.error || '登录失败');
        }
      } catch (err) {
        showError('网络错误，请重试');
      }
    });
  </script>
</body>
</html>
