version: "3.8"

services:
  jokerxcolor:
    build: .
    image: jokerxcolor:latest
    container_name: jokerxcolor
    restart: unless-stopped
    # 主机网络模式（取消注释即可使用）
    # network_mode: "host"
    ports:
      - "1314:1314"
    environment:
      - PORT=1314
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please-use-a-long-random-string}
      - DATABASE_PATH=/app/data/colors.db
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      # Casdoor SSO 配置（可选）
      - CASDOOR_ENABLED=${CASDOOR_ENABLED:-false}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT:-}
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID:-}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET:-}
      - CASDOOR_ORG_NAME=${CASDOOR_ORG_NAME:-}
      - CASDOOR_APP_NAME=${CASDOOR_APP_NAME:-}
      - CASDOOR_REDIRECT_URI=${CASDOOR_REDIRECT_URI:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1314/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
