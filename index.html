<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jokerx颜色代码 · HEX / RGB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='13' height='13' rx='3' fill='%2300A9E0'/%3E%3Crect x='16' y='16' width='13' height='13' rx='3' fill='%23FF003E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<script>
  /* 主题模式预置：避免刷新时闪屏（必须在样式加载前设置） */
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('color-codes-theme') || 'auto'; } catch (e) { /* 忽略 */ }
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="serverBanner" class="banner" hidden>
  <span>数据服务未启动：请双击 <code>start.bat</code>（Windows）或 <code>start.sh</code>（Mac/Linux）启动，再访问 <code>http://0.0.0.0:1314</code>，分组与颜色将保存到 <code>data/colors.json</code>。</span>
  <button type="button" class="banner-close" id="bannerClose" aria-label="关闭提示">&times;</button>
</div>

<header>
  <div class="header-text">
    <h1>Jokerx颜色代码</h1>
    <p class="sub">按分组管理颜色，长方形色块展示，HEX 与 RGB 双格式一键复制</p>
  </div>
  <div class="theme-switch" id="themeSwitch" role="group" aria-label="背景颜色模式">
    <button type="button" data-theme-choice="light">白天</button>
    <button type="button" data-theme-choice="dark">黑夜</button>
    <button type="button" data-theme-choice="auto">适应系统</button>
  </div>
</header>

<nav class="tabbar" aria-label="颜色分组">
  <div id="tabs" class="tabs"></div>
</nav>

<section class="group-head">
  <h2 class="group-title" id="groupTitle"></h2>
  <span class="group-count" id="groupCount"></span>
  <div class="head-actions">
    <button type="button" class="sort-toggle" id="sortToggle" aria-pressed="false" aria-label="开启或关闭拖拽排序">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/></svg>
      <span id="sortLabel">排序</span>
    </button>
    <button type="button" class="rename-btn" id="renameBtn" aria-label="重命名当前分组">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      重命名
    </button>
    <button type="button" class="del-group" id="delGroupBtn" aria-label="删除当前分组"></button>
  </div>
</section>

<form id="addForm" class="add-panel" novalidate>
  <div class="name-field">
    <label class="field-label" for="nameInput">名称</label>
    <input class="text-input" id="nameInput" type="text" placeholder="如：天蓝" autocomplete="off">
  </div>
  <div class="color-field">
    <label class="field-label" for="colorPicker">颜色</label>
    <div class="color-box">
      <input id="colorPicker" type="color" value="#00A9E0" aria-label="选择颜色">
      <input id="hexInput" class="hex-input" type="text" value="#00A9E0" spellcheck="false" aria-label="十六进制颜色代码">
    </div>
  </div>
  <button class="add-btn" type="submit">添加颜色</button>
</form>

<main id="grid" class="grid" aria-label="颜色列表"></main>

<footer>
  <span>分组与颜色实时保存在 data/colors.json 文件中</span>
  <span class="footer-actions">
    <button type="button" class="data-btn" id="exportBtn">导出数据</button>
    <button type="button" class="data-btn" id="importBtn">导入数据</button>
    <button type="button" class="reset-data" id="resetDataBtn">恢复默认数据</button>
  </span>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
